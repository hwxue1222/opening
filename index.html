<style>

  --kimi-color-danger: #e53935;
  --kimi-color-positive: #43a047;
  --kimi-color-warning: #f5a623;

}

    --kimi-color-text-tertiary: #777777;
    --kimi-color-text-quaternary: #555555;
    --kimi-color-surface: #1a1a1a;
    --kimi-color-surface-muted: #2a2a2a;
    --kimi-color-surface-raised: #333333;
    --kimi-color-surface-strong: #444444;

body {

.gantt-app { display: flex; flex-direction: column; height: 100vh; }
.gantt-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--kimi-color-border); flex-shrink: 0; }
.gantt-title { font-size: 18px; font-weight: 500; }

.gantt-btn:hover { background: var(--kimi-color-surface-raised); }

.gantt-body { display: flex; flex: 1; overflow: hidden; }
.gantt-task-col { width: 520px; flex-shrink: 0; border-right: 1px solid var(--kimi-color-border); overflow-y: auto; }
.gantt-task-header { height: 40px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 500; color: var(--kimi-color-text-secondary); border-bottom: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface-muted); }
.gantt-task-group { border-bottom: 1px solid var(--kimi-color-border); }
.gantt-task-row { height: 44px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; cursor: pointer; transition: background var(--t-fast) var(--ease-out); user-select: none; }
.gantt-task-row:hover { background: var(--kimi-color-surface-raised); }
.gantt-task-row.active { background: color-mix(in srgb, var(--kimi-color-accent) 8%, transparent); }
.gantt-task-row .expand-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; margin-right: 6px; font-size: 11px; color: var(--kimi-color-text-tertiary); transition: transform var(--t-fast) var(--ease-out); flex-shrink: 0; cursor: pointer; }
.gantt-task-row .expand-icon.expanded { transform: rotate(90deg); }
.gantt-task-row .task-cat { width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; flex-shrink: 0; }
.gantt-task-row .task-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt-task-row .task-progress { font-size: 11px; color: var(--kimi-color-text-quaternary); margin-left: 4px; flex-shrink: 0; }
.gantt-task-row .task-status { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; flex-shrink: 0; }
.gantt-subtask-list { display: none; padding-left: 32px; padding-bottom: 6px; }
.gantt-subtask-list.open { display: block; }

.gantt-subtask-row { display: flex; align-items: center; padding: 5px 12px 5px 0; font-size: 13px; border-radius: 6px; gap: 6px; }
.gantt-subtask-row:hover { background: var(--kimi-color-surface-raised); }
.gantt-subtask-row .sub-check { width: 16px; height: 16px; border: 1.5px solid var(--kimi-color-border); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all var(--t-fast) var(--ease-out); }
.gantt-subtask-row .sub-check.checked { background: var(--kimi-color-text-primary); border-color: var(--kimi-color-text-primary); }
.gantt-subtask-row .sub-check.checked::after { content: "✓"; color: var(--kimi-color-surface); font-size: 10px; font-weight: 600; }
.gantt-subtask-row .sub-name { flex: 1; color: var(--kimi-color-text-secondary); cursor: text; padding: 2px 4px; border-radius: 4px; transition: background var(--t-fast); min-width: 0; }
.gantt-subtask-row .sub-name:hover { background: var(--kimi-color-surface-muted); }
.gantt-subtask-row .sub-name.done { color: var(--kimi-color-text-quaternary); text-decoration: line-through; }
.gantt-subtask-row .sub-name.editing { background: var(--kimi-color-surface-raised); outline: 1px solid var(--kimi-color-accent); color: var(--kimi-color-text-primary); text-decoration: none; }
.gantt-subtask-row .sub-del { opacity: 0; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--kimi-color-text-quaternary); flex-shrink: 0; transition: all var(--t-fast); }
.gantt-subtask-row:hover .sub-del { opacity: 1; }

.gantt-subtask-add { display: flex; align-items: center; padding: 4px 12px 4px 34px; font-size: 13px; color: var(--kimi-color-text-quaternary); cursor: pointer; border-radius: 6px; margin-right: 12px; transition: all var(--t-fast); }
.gantt-subtask-add:hover { color: var(--kimi-color-text-primary); background: var(--kimi-color-surface-raised); }
.gantt-subtask-add .add-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; margin-right: 6px; font-size: 14px; }

.proc-table { margin: 4px 12px 8px 32px; border: 1px solid var(--kimi-color-border); border-radius: 8px; overflow: hidden; }
.proc-table-header { display: grid; grid-template-columns: 28px 1fr 60px 70px 70px 28px 28px 20px; gap: 4px; padding: 6px 8px; background: var(--kimi-color-surface-muted); font-size: 11px; color: var(--kimi-color-text-secondary); font-weight: 500; border-bottom: 1px solid var(--kimi-color-border); }
.proc-table-row { display: grid; grid-template-columns: 28px 1fr 60px 70px 70px 28px 28px 20px; gap: 4px; padding: 5px 8px; font-size: 12px; border-bottom: 1px solid var(--kimi-color-border); align-items: center; transition: background var(--t-fast); }
.proc-table-row:last-child { border-bottom: none; }

.proc-table-row .pt-check { width: 16px; height: 16px; border: 1.5px solid var(--kimi-color-border); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--t-fast); }

.proc-table-row .pt-cell:hover { background: var(--kimi-color-surface-muted); }
.proc-table-row .pt-cell.editing { background: var(--kimi-color-surface-raised); outline: 1px solid var(--kimi-color-accent); }
.proc-table-row .pt-cell.num { text-align: right; font-variant-numeric: tabular-nums; }
.proc-table-row .pt-ship, .proc-table-row .pt-arrive { width: 16px; height: 16px; border: 1.5px solid var(--kimi-color-border); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--t-fast); }
.proc-table-row .pt-ship.shipped { background: color-mix(in srgb, var(--kimi-color-warning) 20%, transparent); border-color: var(--kimi-color-warning); }
.proc-table-row .pt-ship.shipped::after { content: "📦"; font-size: 9px; }
.proc-table-row .pt-arrive.arrived { background: color-mix(in srgb, var(--kimi-color-positive) 20%, transparent); border-color: var(--kimi-color-positive); }
.proc-table-row .pt-arrive.arrived::after { content: "✓"; color: var(--kimi-color-positive); font-size: 10px; font-weight: 600; }
.proc-table-row .pt-del { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--kimi-color-text-quaternary); opacity: 0; transition: all var(--t-fast); }
.proc-table-row:hover .pt-del { opacity: 1; }
.proc-table-row .pt-del:hover { background: color-mix(in srgb, var(--kimi-color-danger) 12%, transparent); color: var(--kimi-color-danger); }
.proc-table-add { display: flex; align-items: center; padding: 6px 8px; font-size: 12px; color: var(--kimi-color-text-quaternary); cursor: pointer; background: var(--kimi-color-surface-muted); transition: all var(--t-fast); }
.proc-table-add:hover { color: var(--kimi-color-text-primary); background: var(--kimi-color-surface-raised); }
.proc-table-add .add-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; margin-right: 6px; font-size: 14px; }

.gantt-chart-area { flex: 1; overflow: auto; position: relative; }
.gantt-chart-header { height: 40px; display: flex; border-bottom: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface-muted); position: sticky; top: 0; z-index: 5; }
.gantt-day-cell { width: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--kimi-color-text-secondary); border-right: 1px solid var(--kimi-color-border); flex-shrink: 0; }
.gantt-day-cell.weekend { background: color-mix(in srgb, var(--kimi-color-surface-muted) 70%, transparent); color: var(--kimi-color-text-quaternary); }
.gantt-day-cell.today { background: color-mix(in srgb, var(--kimi-color-accent) 12%, transparent); color: var(--kimi-color-accent); font-weight: 500; }
.gantt-chart-rows { position: relative; }
.gantt-chart-group { border-bottom: 1px solid var(--kimi-color-border); }
.gantt-chart-row { height: 44px; position: relative; }
.gantt-chart-subrows { display: none; }
.gantt-chart-subrows.open { display: block; }
.gantt-chart-subrow { height: 32px; position: relative; border-bottom: 1px dashed var(--kimi-color-border); }
.gantt-bar { position: absolute; height: 24px; top: 10px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.gantt-bar:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.1); z-index: 10; }
.gantt-bar .bar-text { color: #fff; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.gantt-bar .bar-progress { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,0.25); border-radius: 6px 0 0 6px; transition: width var(--t-fast) var(--ease-out); }
.gantt-today-line { position: absolute; top: 40px; bottom: 0; width: 2px; background: var(--kimi-color-accent); z-index: 4; pointer-events: none; }
.gantt-today-label { position: absolute; top: 42px; font-size: 10px; color: var(--kimi-color-accent); background: var(--kimi-color-surface); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--kimi-color-accent); z-index: 4; }
.gantt-grid-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; pointer-events: none; }
.gantt-grid-col { width: 36px; border-right: 1px solid var(--kimi-color-border); flex-shrink: 0; }
.gantt-grid-col.weekend { background: color-mix(in srgb, var(--kimi-color-surface-muted) 50%, transparent); }
.gantt-detail-panel { position: absolute; right: 16px; top: 16px; width: 280px; background: var(--kimi-color-surface-raised); border: 1px solid var(--kimi-color-border); border-radius: 12px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); z-index: 20; display: none; }

.gantt-detail-title { font-size: 15px; font-weight: 500; margin-bottom: 12px; }

.gantt-detail-value { color: var(--kimi-color-text-primary); font-weight: 500; }
.gantt-detail-desc { font-size: 13px; color: var(--kimi-color-text-secondary); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--kimi-color-border); line-height: 1.5; }
.gantt-detail-close { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--kimi-color-text-tertiary); font-size: 16px; }
.gantt-detail-close:hover { background: var(--kimi-color-surface-muted); color: var(--kimi-color-text-primary); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--kimi-color-text-primary); color: var(--kimi-color-surface); padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 100; opacity: 0; transition: all 300ms var(--ease-out); pointer-events: none; }

@media (max-width: 900px) {
  .gantt-task-col { width: 100%; border-right: none; }

  .gantt-chart-area { height: 300px; }
  .gantt-header { flex-wrap: wrap; gap: 8px; }
  .gantt-actions { width: 100%; justify-content: flex-end; }

</style>
</head>

let expandedIds = new Set();
let activeTaskId = null;

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.tasks && Array.isArray(parsed.tasks)) {
        tasks = parsed.tasks;
        if (parsed.expandedIds) expandedIds = new Set(parsed.expandedIds);
        return;
      }
    }
  } catch (e) {}
  tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tasks: tasks,
      expandedIds: Array.from(expandedIds),
      savedAt: new Date().toISOString()
    }));
  } catch (e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function resetData() {
  if (confirm('确定重置所有数据到初始状态吗？当前修改将丢失。')) {
    localStorage.removeItem(STORAGE_KEY);
    tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
    expandedIds = new Set();
    activeTaskId = null;
    render();
    showToast('数据已重置');
  }
}

function exportHTML() {
  const blob = new Blob([`<!DOCTYPE html>
<html lang="zh-CN">
` + document.documentElement.innerHTML + `
</html>`], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'restaurant_opening_gantt_' + new Date().toISOString().slice(0,10) + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出HTML文件，请上传到GitHub');
}

function getDaysDiff(d1, d2) {
  return Math.round((new Date(d2) - new Date(d1)) / (1000 * 60 * 60 * 24));
}
function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}
function getTotalDays() {
  return getDaysDiff(START_DATE, OPENING_DATE) + 5;
}
function isWeekend(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay();
  return day === 0 || day === 6;
}
function isToday(dateStr) {
  const today = new Date().toISOString().split('T')[0];
  return dateStr === today;
}

function computeProgress(task) {
  if (!task.subtasks || task.subtasks.length === 0) return 0;
  const done = task.subtasks.filter(s => s.done).length;
  return Math.round((done / task.subtasks.length) * 100);
}
function computeStatus(task) {
  const p = computeProgress(task);
  if (p === 0) return '未开始';
  if (p === 100) return '已完成';
  return '进行中';
}

function renderProcurementTable(task) {
  const tid = task.id;
  return `
    <div class="proc-table">
      <div class="proc-table-header">
        <span></span>
        <span>名称</span>
        <span>数量</span>
        <span>预算</span>
        <span>付款</span>
        <span title="出货">📦</span>
        <span title="到货">✓</span>
        <span></span>
      </div>
      ${task.subtasks.map((sub, si) => `
        <div class="proc-table-row" data-tid="${tid}" data-sid="${si}">
          <div class="pt-check ${sub.done ? 'checked' : ''}" data-field="done"></div>
          <div class="pt-cell" data-field="name">${sub.name}</div>
          <div class="pt-cell num" data-field="qty">${sub.qty || '-'}</div>
          <div class="pt-cell num" data-field="budget">${sub.budget || '-'}</div>
          <div class="pt-cell" data-field="payment">${sub.payment || '-'}</div>
          <div class="pt-ship ${sub.shipped ? 'shipped' : ''}" data-field="shipped" title="${sub.shipped ? '已出货' : '未出货'}"></div>
          <div class="pt-arrive ${sub.arrived ? 'arrived' : ''}" data-field="arrived" title="${sub.arrived ? '已到货' : '未到货'}"></div>
          <div class="pt-del" data-tid="${tid}" data-sid="${si}">×</div>
        </div>
      `).join('')}
      <div class="proc-table-add" data-tid="${tid}">
        <span class="add-icon">+</span>
        <span>添加采购项</span>
      </div>
    </div>
  `;
}

function renderStandardSubtasks(task) {
  const tid = task.id;
  return `
    ${task.subtasks.map((sub, si) => `
      <div class="gantt-subtask-row" data-tid="${tid}" data-sid="${si}">
        <div class="sub-check ${sub.done ? 'checked' : ''}"></div>
        <span class="sub-name ${sub.done ? 'done' : ''}" data-tid="${tid}" data-sid="${si}">${sub.name}</span>
        <div class="sub-del" data-tid="${tid}" data-sid="${si}">×</div>
      </div>
    `).join('')}
    <div class="gantt-subtask-add" data-tid="${tid}">
      <span class="add-icon">+</span>
      <span>添加子任务</span>
    </div>
  `;
}

function render() {
  const totalDays = getTotalDays();
  const todayStr = new Date().toISOString().split('T')[0];
  const todayOffset = getDaysDiff(START_DATE, todayStr);

  const daysToOpen = getDaysDiff(todayStr, OPENING_DATE);
  document.getElementById('countdown').textContent = daysToOpen > 0 ? daysToOpen : 0;

  const headerEl = document.getElementById('chart-header');
  let headerHTML = '';
  let gridHTML = '';
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(START_DATE);
    d.setDate(d.getDate() + i);
    const ds = d.toISOString().split('T')[0];
    const isWknd = isWeekend(ds);
    const isTdy = isToday(ds);
    const cls = isWknd ? 'weekend' : (isTdy ? 'today' : '');
    headerHTML += `<div class="gantt-day-cell ${cls}">${d.getMonth() + 1}/${d.getDate()}</div>`;
    gridHTML += `<div class="gantt-grid-col ${isWknd ? 'weekend' : ''}"></div>`;
  }
  headerEl.innerHTML = headerHTML;
  document.getElementById('grid-bg').innerHTML = gridHTML;

  const todayLine = document.getElementById('today-line');
  const todayLabel = document.getElementById('today-label');
  if (todayOffset >= 0 && todayOffset < totalDays) {
    todayLine.style.left = (todayOffset * DAY_WIDTH + DAY_WIDTH / 2) + 'px';
    todayLine.style.display = 'block';
    todayLabel.style.left = (todayOffset * DAY_WIDTH + 4) + 'px';
    todayLabel.style.display = 'block';
  } else {
    todayLine.style.display = 'none';
    todayLabel.style.display = 'none';
  }

  const taskList = document.getElementById('task-list');
  const barsContainer = document.getElementById('bars-container');

  let taskHTML = '';
  let barsHTML = '';

  tasks.forEach(task => {
    const isExpanded = expandedIds.has(task.id);
    const progress = computeProgress(task);
    const status = computeStatus(task);
    const color = CAT_COLORS[task.cat] || 'var(--kimi-chart-1)';
    const st = STATUS_STYLES[status];
    const isActive = activeTaskId === task.id;

    const offset = getDaysDiff(START_DATE, task.start);
    const width = task.days * DAY_WIDTH;
    const left = offset * DAY_WIDTH;

    taskHTML += `
      <div class="gantt-task-group">
        <div class="gantt-task-row ${isActive ? 'active' : ''}" data-id="${task.id}">
          <div class="expand-icon ${isExpanded ? 'expanded' : ''}" data-id="${task.id}">▶</div>
          <div class="task-cat" style="background:${color}"></div>
          <span class="task-name">${task.name}</span>
          <span class="task-progress">${progress}%</span>
          <span class="task-status" style="background:${st.bg}; color:${st.text}">${status}</span>
        </div>
        <div class="gantt-subtask-list ${isExpanded ? 'open' : ''}">
          ${task.isProcurement ? renderProcurementTable(task) : renderStandardSubtasks(task)}
        </div>
      </div>
    `;

    barsHTML += `
      <div class="gantt-chart-group">
        <div class="gantt-chart-row">
          <div class="gantt-bar" style="left:${left}px; width:${width}px; background:${color};" data-id="${task.id}">
            <div class="bar-progress" style="width:${progress}%"></div>
            <span class="bar-text">${task.name} ${progress > 0 ? progress + '%' : ''}</span>
          </div>
        </div>
        <div class="gantt-chart-subrows ${isExpanded ? 'open' : ''}">
          ${task.subtasks.map(() => `<div class="gantt-chart-subrow"></div>`).join('')}
        </div>
      </div>
    `;
  });

  taskList.innerHTML = taskHTML;
  barsContainer.innerHTML = barsHTML;

  document.querySelectorAll('.expand-icon').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = parseInt(el.dataset.id);
      if (expandedIds.has(id)) expandedIds.delete(id);
      else expandedIds.add(id);
      saveData();
      render();
    });
  });

  document.querySelectorAll('.gantt-subtask-row .sub-check').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const tid = parseInt(el.parentElement.dataset.tid);
      const sid = parseInt(el.parentElement.dataset.sid);
      const task = tasks.find(t => t.id === tid);
      if (task) {
        task.subtasks[sid].done = !task.subtasks[sid].done;
        saveData();
        render();
      }
    });
  });

  document.querySelectorAll('.sub-name').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (el.isContentEditable) return;
      const tid = parseInt(el.dataset.tid);
      const sid = parseInt(el.dataset.sid);
      el.contentEditable = true;
      el.classList.add('editing');
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      function save() {
        const task = tasks.find(t => t.id === tid);
        if (task) {
          const newName = el.textContent.trim();
          if (newName) task.subtasks[sid].name = newName;
        }
        el.contentEditable = false;
        el.classList.remove('editing');
        el.removeEventListener('blur', save);
        el.removeEventListener('keydown', onKey);
        saveData();
        render();
      }
      function onKey(ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); save(); }
        if (ev.key === 'Escape') {
          const task = tasks.find(t => t.id === tid);
          if (task) el.textContent = task.subtasks[sid].name;
          el.contentEditable = false;
          el.classList.remove('editing');
          el.removeEventListener('blur', save);
          el.removeEventListener('keydown', onKey);
        }
      }
      el.addEventListener('blur', save);
      el.addEventListener('keydown', onKey);
    });
  });

  document.querySelectorAll('.sub-del').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const tid = parseInt(el.dataset.tid);
      const sid = parseInt(el.dataset.sid);
      const task = tasks.find(t => t.id === tid);
      if (task && task.subtasks.length > 1) {
        task.subtasks.splice(sid, 1);
        saveData();
        render();
      }
    });
  });

  document.querySelectorAll('.gantt-subtask-add').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const tid = parseInt(el.dataset.tid);
      const task = tasks.find(t => t.id === tid);
      if (task) {
        task.subtasks.push({ name: "新子任务", done: false });
        saveData();
        render();
        setTimeout(() => {
          const newEls = document.querySelectorAll(`.sub-name[data-tid="${tid}"]`);
          const lastEl = newEls[newEls.length - 1];
          if (lastEl) lastEl.click();
        }, 50);
      }
    });
  });

  document.querySelectorAll('.pt-check').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const row = el.closest('.proc-table-row');
      const tid = parseInt(row.dataset.tid);
      const sid = parseInt(row.dataset.sid);
      const task = tasks.find(t => t.id === tid);
      if (task) {
        task.subtasks[sid].done = !task.subtasks[sid].done;
        saveData();
        render();
      }
    });
  });

  document.querySelectorAll('.pt-ship').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const row = el.closest('.proc-table-row');
      const tid = parseInt(row.dataset.tid);
      const sid = parseInt(row.dataset.sid);
      const task = tasks.find(t => t.id === tid);
      if (task) {
        task.subtasks[sid].shipped = !task.subtasks[sid].shipped;
        saveData();
        render();
      }
    });
  });

  document.querySelectorAll('.pt-arrive').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const row = el.closest('.proc-table-row');
      const tid = parseInt(row.dataset.tid);
      const sid = parseInt(row.dataset.sid);
      const task = tasks.find(t => t.id === tid);
      if (task) {
        task.subtasks[sid].arrived = !task.subtasks[sid].arrived;
        if (task.subtasks[sid].arrived) task.subtasks[sid].done = true;
        saveData();
        render();
      }
    });
  });

  document.querySelectorAll('.pt-cell').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (el.isContentEditable) return;
      const row = el.closest('.proc-table-row');
      const tid = parseInt(row.dataset.tid);
      const sid = parseInt(row.dataset.sid);
      const field = el.dataset.field;
      const task = tasks.find(t => t.id === tid);
      if (!task) return;

      el.contentEditable = true;
      el.classList.add('editing');
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      function save() {
        const newVal = el.textContent.trim();
        if (newVal) {
          if (field === 'name') task.subtasks[sid].name = newVal;
          else if (field === 'qty') task.subtasks[sid].qty = newVal;
          else if (field === 'budget') task.subtasks[sid].budget = newVal;
          else if (field === 'payment') task.subtasks[sid].payment = newVal;
        }
        el.contentEditable = false;
        el.classList.remove('editing');
        el.removeEventListener('blur', save);
        el.removeEventListener('keydown', onKey);
        saveData();
        render();
      }
      function onKey(ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); save(); }
        if (ev.key === 'Escape') {
          el.textContent = task.subtasks[sid][field] || '-';
          el.contentEditable = false;
          el.classList.remove('editing');
          el.removeEventListener('blur', save);
          el.removeEventListener('keydown', onKey);
        }
      }
      el.addEventListener('blur', save);
      el.addEventListener('keydown', onKey);
    });
  });

  document.querySelectorAll('.pt-del').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const tid = parseInt(el.dataset.tid);
      const sid = parseInt(el.dataset.sid);
      const task = tasks.find(t => t.id === tid);
      if (task && task.subtasks.length > 1) {
        task.subtasks.splice(sid, 1);
        saveData();
        render();
      }
    });
  });

  document.querySelectorAll('.proc-table-add').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const tid = parseInt(el.dataset.tid);
      const task = tasks.find(t => t.id === tid);
      if (task) {
        task.subtasks.push({ name: "新采购项", qty: "", budget: "", payment: "", shipped: false, arrived: false, done: false });
        saveData();
        render();
        setTimeout(() => {
          const newEls = document.querySelectorAll(`.proc-table-row[data-tid="${tid}"] .pt-cell[data-field="name"]`);
          const lastEl = newEls[newEls.length - 1];
          if (lastEl) lastEl.click();
        }, 50);
      }
    });
  });

  document.querySelectorAll('.gantt-task-row, .gantt-bar').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.dataset.id);
      activeTaskId = activeTaskId === id ? null : id;
      render();
      if (activeTaskId !== null) showDetail(activeTaskId);
      else closeDetail();
    });
  });

  document.getElementById('chart-rows').style.width = (totalDays * DAY_WIDTH) + 'px';
}

function showDetail(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  const progress = computeProgress(task);
  document.getElementById('detail-title').textContent = task.name;
  document.getElementById('detail-cat').textContent = task.cat;
  document.getElementById('detail-cat').style.color = CAT_COLORS[task.cat];
  document.getElementById('detail-owner').textContent = task.owner;
  document.getElementById('detail-start').textContent = task.start;
  document.getElementById('detail-end').textContent = addDays(task.start, task.days);
  document.getElementById('detail-duration').textContent = task.days + ' 天';
  document.getElementById('detail-progress').textContent = progress + '%';
  document.getElementById('detail-desc').textContent = task.desc;
  document.getElementById('detail-panel').classList.add('show');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('show');
  activeTaskId = null;
  render();
}

loadData();
render();
</script>
</body>
</html>
